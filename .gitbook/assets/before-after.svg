<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" rx="16" fill="#fafbfc" stroke="#e1e4e8" stroke-width="1"/>

  <!-- Before -->
  <rect x="30" y="20" width="350" height="240" rx="12" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="205" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C0392B">😰 수작업 발주 (Before)</text>

  <text x="55" y="85" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">1. 매장 돌아다니며 재고 눈으로 확인</text>
  <text x="55" y="110" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">2. 엑셀에 수량 하나하나 입력</text>
  <text x="55" y="135" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">3. 경험에 의존한 발주량 결정</text>
  <text x="55" y="160" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">4. 과발주 → 폐기 손실 💸</text>
  <text x="55" y="185" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">5. 결품 → 매출 손실 📉</text>

  <rect x="55" y="205" width="300" height="35" rx="6" fill="#F5B7B1"/>
  <text x="205" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#922B21">매일 2~3시간 소요, 실수 빈번 😫</text>

  <!-- Arrow -->
  <text x="400" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="30">→</text>

  <!-- After -->
  <rect x="420" y="20" width="350" height="240" rx="12" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="595" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E8449">😊 자동 발주 (After)</text>

  <text x="445" y="85" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">1. 판매 데이터 자동 수집</text>
  <text x="445" y="110" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">2. AI가 최적 발주량 자동 계산</text>
  <text x="445" y="135" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">3. 웹에서 한눈에 확인</text>
  <text x="445" y="160" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">4. 버튼 한 번으로 발주 승인 ✅</text>
  <text x="445" y="185" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">5. 재고 부족 자동 알림 🔔</text>

  <rect x="445" y="205" width="300" height="35" rx="6" fill="#ABEBC6"/>
  <text x="595" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1D8348">5분이면 끝! 데이터 기반 정확한 발주 🎯</text>
</svg>
